<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalized Fitness Recommendations</title>
    <link rel="stylesheet" href="/style.css"> <!-- Link to the external CSS file -->
</head>
<body>

    <h1>Personalized Fitness Recommendations</h1>

    <div class="container">
        <label for="goal">Select Your Fitness Goal:</label>
        <select id="goal">
            <option value="weightLoss">Lose Weight</option>
            <option value="muscleGain">Build Muscle</option>
            <option value="mentalHealth">Improve Mental Health</option>
            <option value="generalFitness">General Fitness</option>
            <option value="increaseEnergy">Increase Energy</option>
        </select>

        <label for="fitnessLevel">Select Your Fitness Level:</label>
        <select id="fitnessLevel">
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
        </select>

        <label for="timeAvailable">How much time do you have for your workout?</label>
        <select id="timeAvailable">
            <option value="15">15 minutes</option>
            <option value="30">30 minutes</option>
            <option value="60">60 minutes</option>
        </select>

        <button onclick="getRecommendations()">Get Recommendations</button>

        <div id="recommendations" class="result">
            <h3>Recommended Exercises:</h3>
            <ul id="exerciseList"></ul>
        </div>
    </div>

    <script src="javascript.js"></script> <!-- Link to the external JS file -->
</body>
</html>
